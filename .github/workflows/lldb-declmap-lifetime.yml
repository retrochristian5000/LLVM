name: LLDB incomplete declaration-map ownership

on:
  push:
    branches: [ main ]
    paths:
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUserExpression.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUserExpression.cpp'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUtilityFunction.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUtilityFunction.cpp'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangFunctionCaller.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangFunctionCaller.cpp'
      - 'lldb/scripts/test-declmap-incomplete-lifetime.py'
      - '.github/workflows/lldb-declmap-lifetime.yml'
  pull_request:
    paths:
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUserExpression.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUserExpression.cpp'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUtilityFunction.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangUtilityFunction.cpp'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangFunctionCaller.h'
      - 'lldb/source/Plugins/ExpressionParser/Clang/ClangFunctionCaller.cpp'
      - 'lldb/scripts/test-declmap-incomplete-lifetime.py'
      - '.github/workflows/lldb-declmap-lifetime.yml'

permissions:
  contents: read

jobs:
  ownership-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out LLVM fork
        uses: actions/checkout@v4
      - name: Validate LLDB ClangExpressionDeclMap lifetime definitions
        run: python3 lldb/scripts/test-declmap-incomplete-lifetime.py
