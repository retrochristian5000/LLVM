name: Apple host CPU detection port

on:
  push:
    paths:
      - '.github/workflows/apple-host-cpu-detection-port.yml'

permissions:
  contents: write

concurrency:
  group: apple-host-cpu-detection-port
  cancel-in-progress: true

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm RED unsafe Apple-family fallback
        run: python3 .github/workflows/apple-host-cpu-detection-port.py red
      - name: Apply audited Apple host CPU detection fix
        run: python3 .github/workflows/apple-host-cpu-detection-port.py apply
      - name: Configure focused TargetParser build
        run: |
          cmake -S llvm -B build-apple-hostcpu -G Ninja \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=ON
      - name: Build TargetParser tests
        run: ninja -C build-apple-hostcpu TargetParserTests
      - name: Verify GREEN Apple family mapping
        run: build-apple-hostcpu/unittests/TargetParser/TargetParserTests --gtest_filter=getDarwinHostCPUName.AppleARMFamilyMapping
      - name: Verify conservative Darwin syscall path
        run: python3 .github/workflows/apple-host-cpu-detection-port.py verify
      - name: Commit verified CPU detection fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add llvm/include/llvm/TargetParser/Host.h \
                  llvm/lib/TargetParser/Host.cpp \
                  llvm/unittests/TargetParser/Host.cpp
          git diff --cached --check
          git commit -m 'llvm: harden Apple host CPU detection'
          git push origin HEAD:main
