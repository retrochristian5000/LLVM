name: ARM64e CPU subtype

on:
  push:
    paths:
      - 'lld/MachO/Arch/ARM64.cpp'
      - 'lld/test/MachO/arm64e-cpu-subtype.s'
      - '.github/workflows/arm64e-cpu-subtype.yml'

permissions:
  contents: read

concurrency:
  group: arm64e-cpu-subtype
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure focused LLD build
        run: |
          cmake -S llvm -B build-arm64e-subtype -G Ninja \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=ON
      - name: Build focused tools
        run: ninja -C build-arm64e-subtype lld llvm-mc llvm-objdump FileCheck
      - name: Run ARM64e CPU subtype regression
        run: build-arm64e-subtype/bin/llvm-lit -sv lld/test/MachO/arm64e-cpu-subtype.s
